<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Register</title>
  <style>
    :root {
      --bg-color: #F8F5EE;
      --card-bg: #FFFFFF;
      --primary-accent: #A36B28;
      --primary-hover: #86551E;
      --text-dark: #2B332B;
      --text-muted: #6B7280;
      --border-color: #A36B28;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 40px 32px;
      box-shadow: var(--shadow);
    }

    .subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary-accent);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .title {
      font-family: Georgia, serif;
      font-size: 32px;
      font-weight: bold;
      color: var(--text-dark);
      margin-bottom: 24px;
    }

    .user-select-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .user-btn {
      background: #FAFAFA;
      border: 1px solid #E5E7EB;
      padding: 14px;
      border-radius: 4px;
      font-size: 16px;
      color: var(--text-dark);
      cursor: pointer;
      text-align: left;
      font-weight: 500;
      transition: all 0.2s;
    }

    .user-btn:hover {
      border-color: var(--primary-accent);
      background: #FFF9F2;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .selected-user-badge {
      display: inline-block;
      background: #F3EFE6;
      color: var(--primary-accent);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #D1D5DB;
      border-radius: 4px;
      outline: none;
      letter-spacing: 4px;
    }

    input[type="password"]:focus, input[type="text"]:focus {
      border-color: var(--primary-accent);
    }

    .btn-primary {
      width: 100%;
      background: var(--primary-accent);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-back {
      display: block;
      width: 100%;
      text-align: center;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 16px;
      cursor: pointer;
    }

    .btn-back:hover {
      color: var(--text-dark);
    }

    .error-msg {
      color: #DC2626;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    /* Screen Management */
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }

    /* Inactivity Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 6px;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-content h3 {
      font-family: Georgia, serif;
      margin-bottom: 12px;
      color: var(--text-dark);
    }

    .modal-content p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- STEP 1: USER SELECTION -->
  <div id="screen-users" class="card screen active">
    <div class="subtitle">CASH & CARD REGISTER</div>
    <div class="title">Daily Register</div>
    <div class="input-group">
      <label>Select User</label>
      <div class="user-select-list">
        <button class="user-btn" onclick="selectUser('User 1')">User 1</button>
        <button class="user-btn" onclick="selectUser('User 2')">User 2</button>
        <button class="user-btn" onclick="selectUser('Manager')">Manager</button>
      </div>
    </div>
  </div>

  <!-- STEP 2: PIN ENTRY -->
  <div id="screen-pin" class="card screen">
    <div class="subtitle">CASH & CARD REGISTER</div>
    <div class="title">Daily Register</div>
   
    <div class="selected-user-badge">User: <span id="display-user-name"></span></div>
   
    <form onsubmit="handleLogin(event)">
      <div class="input-group">
        <label for="pin-input">PIN</label>
        <input type="password" id="pin-input" maxlength="6" pattern="[0-9]*" inputmode="numeric" placeholder="••••" required autocomplete="off">
        <div id="login-error" class="error-msg">Incorrect PIN. Please try again.</div>
      </div>
      <button type="submit" class="btn-primary">Enter</button>
      <button type="button" class="btn-back" onclick="showUserSelection()">← Back</button>
    </form>
  </div>

  <!-- STEP 3: DASHBOARD (MAIN REGISTER) -->
  <div id="screen-dashboard" class="card screen">
    <div class="subtitle">WELCOME</div>
    <div class="title" id="welcome-title">Daily Register</div>
    <p style="margin-bottom: 24px; color: var(--text-muted);">You are securely logged into the register.</p>

    <button type="button" class="btn-primary" onclick="logout()">Log Out</button>
  </div>

</div>

<!-- TIMEOUT POPUP MODAL -->
<div id="timeout-modal" class="modal-overlay">
  <div class="modal-content">
    <h3>Session Timing Out</h3>
    <p>You have been inactive. You will be automatically logged out in <span id="modal-timer">30</span> seconds.</p>
    <button class="btn-primary" onclick="resetInactivityTimer()">Stay Logged In</button>
  </div>
</div>

<script>
  // Setup User Accounts & PINs (Change PINs as needed)
  const users = {
    'User 1': '1234',
    'User 2': '5678',
    'Manager': '9999'
  };

  let selectedUser = null;
  let inactivityTimer = null;
  let countdownTimer = null;
  const INACTIVITY_LIMIT = 5 * 60 * 1000; // 5 minutes in milliseconds
  const WARNING_LIMIT = 30; // 30 seconds warning countdown

  function selectUser(userName) {
    selectedUser = userName;
    document.getElementById('display-user-name').textContent = userName;
    clearPinInput();
    switchScreen('screen-pin');
    document.getElementById('pin-input').focus();
  }

  function showUserSelection() {
    selectedUser = null;
    clearPinInput();
    switchScreen('screen-users');
  }

  function clearPinInput() {
    const pinInput = document.getElementById('pin-input');
    pinInput.value = '';
    document.getElementById('login-error').style.display = 'none';
  }

  function handleLogin(event) {
    event.preventDefault();
    const enteredPin = document.getElementById('pin-input').value;

    if (selectedUser && users[selectedUser] === enteredPin) {
      // Login successful
      document.getElementById('welcome-title').textContent = `Hello, ${selectedUser}`;
      clearPinInput();
      switchScreen('screen-dashboard');
      startInactivityTracker();
    } else {
      // Login failed
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('pin-input').value = '';
      document.getElementById('pin-input').focus();
    }
  }

  function logout() {
    stopInactivityTracker();
    clearPinInput();
    selectedUser = null;
    hideModal();
    switchScreen('screen-users');
  }

  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  // --- AUTOMATED 5-MINUTE TIMEOUT & POPUP LOGIC ---

  function startInactivityTracker() {
    stopInactivityTracker();
    // Listen to all common activity events
    ['click', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, resetInactivityTimer);
    });
    resetInactivityTimer();
  }

  function stopInactivityTracker() {
    clearTimeout(inactivityTimer);
    clearInterval(countdownTimer);
    ['click', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(evt => {
      window.removeEventListener(evt, resetInactivityTimer);
    });
  }

  function resetInactivityTimer() {
    hideModal();
    clearTimeout(inactivityTimer);
    clearInterval(countdownTimer);

    // Only set timer if user is logged into dashboard
    if (document.getElementById('screen-dashboard').classList.contains('active')) {
      inactivityTimer = setTimeout(showInactivityWarning, INACTIVITY_LIMIT);
    }
  }

  function showInactivityWarning() {
    let secondsLeft = WARNING_LIMIT;
    document.getElementById('modal-timer').textContent = secondsLeft;
    document.getElementById('timeout-modal').classList.add('active');

    countdownTimer = setInterval(() => {
      secondsLeft--;
      document.getElementById('modal-timer').textContent = secondsLeft;
      if (secondsLeft <= 0) {
        clearInterval(countdownTimer);
        logout();
      }
    }, 1000);
  }

  function hideModal() {
    document.getElementById('timeout-modal').classList.remove('active');
  }
</script>

</body>
</html>
